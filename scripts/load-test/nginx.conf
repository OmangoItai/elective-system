worker_processes auto;

events {
  worker_connections 10240;
  use epoll;
  multi_accept on;
}

http {
  upstream app {
    server app:8080;
    keepalive 100;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
